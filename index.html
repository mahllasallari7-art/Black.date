<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یک قرار خاص 💗</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

font-family:tahoma;

background:
linear-gradient(
135deg,
#8b003f,
#350019
);

overflow:hidden;

}



.card{

width:90%;
max-width:430px;

background:rgba(255,255,255,.88);

padding:35px;

border-radius:35px;

text-align:center;

box-shadow:
0 20px 60px rgba(0,0,0,.35);

color:#65002f;

animation:show 1s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



h1{

color:#a0004d;

}



p{

font-size:19px;

line-height:2;

}



button{

border:0;

border-radius:40px;

padding:15px 30px;

margin:10px;

font-size:18px;

cursor:pointer;

transition:.4s;

}



#yes{

background:#a0004d;

color:white;

}



#no{

background:#eee;

color:#80003b;

}



button:hover{

transform:scale(1.1);

}



.floating{

position:fixed;

font-size:25px;

animation:float 8s linear infinite;

}



@keyframes float{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-20vh);

}

}



.boom{

position:fixed;

font-size:30px;

z-index:10;

animation:boom 1.5s forwards;

}



@keyframes boom{

0%{

transform:translate(0,0) scale(.2);

opacity:1;

}


100%{

transform:translate(var(--x),var(--y)) scale(1.5);

opacity:0;

}

}



input{

width:90%;

padding:12px;

margin:8px;

border-radius:20px;

border:1px solid #ddd;

font-size:16px;

}



</style>

</head>


<body>


<div class="floating" style="left:15%">💗</div>
<div class="floating" style="left:50%;animation-delay:2s">💗</div>
<div class="floating" style="left:80%;animation-delay:4s">💗</div>



<div class="card" id="app">


<h1>
افرودیت زیبای من 💗
</h1>


<p id="text">

با من میای سر یه دیت خاص؟ ✨

</p>


<button id="yes" onclick="yesClick()">

آره 😍

</button>


<button id="no" onclick="noClick()">

نه

</button>


</div>



<script>


let yesSize=18;

let noIndex=0;


function noClick(){


let messages=[

"مطمئنی؟ یه بار دیگه فکر کن 💗",

"شاید این همون قراری باشه که بعداً خوشحالت کنه 😌",

"هنوز فرصت داری انتخاب قشنگ‌تری داشته باشی ✨",

"فکر کنم جواب قلبت یه چیز دیگه‌ست 💗"

];


document.getElementById("text").innerHTML=
messages[Math.min(noIndex,3)];


noIndex++;


yesSize+=12;


document.getElementById("yes").style.fontSize=
yesSize+"px";


document.getElementById("yes").style.transform=
"scale(1.1)";


}



function heartBoom(){


for(let i=0;i<70;i++){


let h=document.createElement("div");


h.className="boom";

h.innerHTML="💗";


h.style.left="50%";
h.style.top="50%";


h.style.setProperty(
"--x",
(Math.random()*700-350)+"px"
);


h.style.setProperty(
"--y",
(Math.random()*700-350)+"px"
);


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},1500);



}


}



function yesClick(){


heartBoom();


setTimeout(()=>{


document.getElementById("app").innerHTML=

`

<h1>
انتخاب قشنگی کردی 💗
</h1>


<p>
حالا زمان قرارمون رو انتخاب کن ✨
</p>


<button onclick="datePage()">

انتخاب تاریخ 📅

</button>


`;


},1500);


}



function datePage(){


document.getElementById("app").innerHTML=

`

<h1>
کی وقت داری؟ 📅
</h1>


<p>
یه تاریخ و ساعت خوب انتخاب کن
</p>


<input type="date" id="date">


<input type="time" id="time">


<p style="font-size:14px">

لطفاً پنج‌شنبه و جمعه رو انتخاب نکن 💗

</p>


<button onclick="saveDate()">

ادامه

</button>

`;


}



function saveDate(){


window.myDate=
document.getElementById("date").value;


window.myTime=
document.getElementById("time").value;


foodPage();


}


</script>
<script>

let myFood="";


function foodPage(){

document.getElementById("app").innerHTML=

`

<h1>
حالا انتخاب با توئه 💗
</h1>


<div class="plate">
🍽️
</div>


<p>
دوست داری مهمون چی بشی؟ ✨
</p>



<div class="food" onclick="selectFood('همبرگر معروف')">

🍔
<br>
همبرگر معروف

</div>



<div class="food" onclick="selectFood('جیگر طرقبه')">

🥩
<br>
جیگر طرقبه

</div>



<div class="food" onclick="selectFood('پیتزا آفتابگردون')">

🍕
<br>
پیتزا آفتابگردون

</div>



<div class="food" onclick="selectFood('قهوه کافه')">

☕
<br>
قهوه (کافه)

</div>



`;

}



function selectFood(food){


myFood=food;


let all=document.querySelectorAll(".food");


all.forEach(item=>{

item.classList.remove("selected");

});


event.currentTarget.classList.add("selected");



setTimeout(()=>{

lastPage();

},900);


}



</script>



<style>


.plate{

font-size:90px;

display:inline-block;

animation:plateMove 3s infinite linear;

}



@keyframes plateMove{

0%{

transform:rotate(0deg) translateY(0);

}


50%{

transform:rotate(180deg) translateY(-10px);

}


100%{

transform:rotate(360deg) translateY(0);

}

}



.food{

background:

rgba(160,0,75,.12);

padding:18px;

margin:12px 0;

border-radius:25px;

font-size:19px;

cursor:pointer;

transition:.5s;

animation:foodIn .7s;

}



.food:hover{

transform:translateY(-8px) scale(1.05);

background:

rgba(160,0,75,.25);

}



.food.selected{

transform:scale(1.2);

background:

rgba(160,0,75,.35);

box-shadow:

0 0 25px rgba(160,0,75,.4);

}



@keyframes foodIn{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



</style>
<script>

function lastPage(){

document.getElementById("app").innerHTML=

`

<h1>
خوشحالم نگفتی نه! 💗
</h1>


<p>

پس در تاریخ:

<br>

<b>${myDate}</b>

<br>

ساعت:

<b>${myTime}</b>


<br><br>


میام دنبالت، برای ${myFood} 🥂


<br><br>


پس آماده باش، خودم میام دنبالت 🚗💨


<br><br>


برای درخواست از زیباترین دختر دنیا، یه سایت کوچولو طراحی کردم ❤️


</p>


<button onclick="finalBoom()">

💗

</button>


`;

}




function finalBoom(){


for(let i=0;i<100;i++){


let heart=document.createElement("div");


heart.className="boom";

heart.innerHTML="💗";


heart.style.left="50%";
heart.style.top="50%";


heart.style.setProperty(
"--x",
(Math.random()*900-450)+"px"
);


heart.style.setProperty(
"--y",
(Math.random()*900-450)+"px"
);



document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},1600);



}



setTimeout(()=>{


document.getElementById("app").innerHTML=

`

<h1>
💗
</h1>


<p style="font-size:25px">


حیف داستانمون بود که انقدر بی‌سر و ته تموم شه!


</p>


`;



},1700);



}



</script>


</body>

</html>
