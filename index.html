<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>برای افرودیت ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:tahoma, sans-serif;
    overflow:hidden;
    
    background:
    linear-gradient(rgba(80,0,20,.75),rgba(30,0,10,.9)),
    url("photo.jpg");

    background-size:cover;
    background-position:center;
}


/* قلب های شناور */

.heart{
    position:absolute;
    color:#ffb6c1;
    animation:float 8s linear infinite;
    opacity:.6;
}

@keyframes float{

0%{
    transform:translateY(100vh) scale(1);
}

100%{
    transform:translateY(-20vh) scale(1.5);
}

}



.box{

    width:90%;
    max-width:420px;

    background:rgba(60,0,20,.85);

    border:1px solid rgba(255,255,255,.2);

    padding:35px;

    border-radius:35px;

    text-align:center;

    color:white;

    box-shadow:
    0 0 40px #000;

    animation:show 1.5s;

}


@keyframes show{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}


h1{

color:#ffd1dc;

font-size:30px;

}



p{

font-size:19px;

line-height:2;

}



button{

border:none;

padding:15px 30px;

border-radius:40px;

font-size:18px;

margin:10px;

cursor:pointer;

transition:.3s;

}



#yes{

background:#b0003a;

color:white;

}



#no{

background:#444;

color:white;

}



</style>

</head>


<body>


<div class="heart" style="left:10%;animation-delay:1s;">❤️</div>
<div class="heart" style="left:40%;animation-delay:3s;">❤️</div>
<div class="heart" style="left:70%;animation-delay:5s;">❤️</div>
<div class="heart" style="left:85%;animation-delay:2s;">❤️</div>


<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>



<div class="box">


<h1>
افرودیت زیبای من ❤️
</h1>


<p>

یه سوال مهم دارم ازت... 🌙

<br>

با من میای سر یه دیت خاص؟ 💕

</p>



<button id="yes" onclick="yesClick()">
😍 آره میام
</button>


<button id="no" onclick="noClick()">
😐 نه
</button>



</div>



<script>


let size=18;


function noClick(){

size+=10;

document.getElementById("yes").style.fontSize=size+"px";

}



function yesClick(){

document.querySelector(".box").innerHTML=

`
<h1>
آفرین 😍❤️
</h1>

<p>
می‌دونستم انتخاب درستی می‌کنی ✨

<br><br>

یه قرار قشنگ در انتظارمونه 🌙

</p>
`;



let music=document.getElementById("music");

music.play().catch(()=>{});

}


</script>


</body>

</html>
