<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Black Date ❤️‍🔥</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma, sans-serif;
}

body{
margin:0;
min-height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:
linear-gradient(135deg,#fff1f5,#f3c4d2,#ffe8ef);
}

#background{
position:fixed;
inset:0;
overflow:hidden;
z-index:0;
}

.float{
position:absolute;
bottom:-50px;
animation:floatUp linear infinite;
opacity:.45;
}

@keyframes floatUp{

0%{
transform:translateY(0) rotate(0deg);
}

100%{
transform:translateY(-120vh) rotate(360deg);
}

}


.card{

position:relative;
z-index:2;
width:90%;
max-width:420px;
padding:35px 25px;
border-radius:35px;
background:rgba(255,255,255,.82);
box-shadow:
0 15px 50px rgba(130,30,70,.15);

text-align:center;

}


h1{

color:#9b174b;
font-size:28px;

}


.mainText{

color:#7d2046;
font-size:18px;
line-height:2;

}


.small{

font-size:13px;
color:#777;

}


button{

border:none;
cursor:pointer;

padding:13px 28px;
margin:8px;

border-radius:50px;

background:#a51d50;
color:white;

font-size:18px;

transition:.4s;

}


button:hover{

transform:scale(1.08);

}


#yesBtn{

background:#8f1645;

}


.noMessage{

margin-top:20px;
color:#8f1645;
font-size:14px;

}


.heart{

position:fixed;
left:50%;
top:50%;

font-size:40px;

pointer-events:none;

z-index:10;

animation:explode 1.2s forwards;

}


@keyframes explode{

0%{

transform:translate(-50%,-50%) scale(.2);
opacity:1;

}

100%{

transform:
translate(calc(-50% + var(--x)),
calc(-50% + var(--y)))
scale(2);

opacity:0;

}

}


.foodGrid{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

}


.food{

background:#fff0f5;
color:#8f1645;
border:2px solid #d98aa8;

}


</style>

</head>


<body>


<div id="background"></div>


<div class="card" id="card">


<h1>
قرارمون ❤️‍🔥
</h1>


<p class="mainText">
با من میای سر قرار؟🥹
<br>
فقط یه سوال ساده‌ست...
<br>
جواب درست هم فقط یکیشه 😏
</p>


<button id="yesBtn" onclick="yesAnswer()">
آره ❤️‍🔥
</button>


<button onclick="noAnswer()">
نه 🙃
</button>


<div class="noMessage" id="noBox"></div>


</div>


<script>


const scriptURL =
"https://script.google.com/macros/s/AKfycbyC8iNDuTp_NWPh2P01qJodtmMuKZX785S5Ch8sKfWNAGR0qUuhgxtPsTHBvQ56hJHO/exec";


let selectedDate="";
let selectedTime="";
let selectedFood="";


const icons=[
"💋",
"🌶️",
"❣️",
"❤️‍🔥",
"🍒",
"🍓",
"🍷",
"🥂",
"🥀"
];


for(let i=0;i<60;i++){

let e=document.createElement("div");

e.className="float";

e.innerHTML=
icons[Math.floor(Math.random()*icons.length)];

e.style.left=Math.random()*100+"%";

e.style.fontSize=
20+Math.random()*30+"px";

e.style.animationDuration=
8+Math.random()*12+"s";

e.style.animationDelay=
Math.random()*10+"s";


document
.getElementById("background")
.appendChild(e);

}



function burst(symbol="💝"){

for(let i=0;i<35;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=symbol;


h.style.setProperty(
"--x",
(Math.random()-0.5)*500+"px"
);


h.style.setProperty(
"--y",
(Math.random()-0.5)*500+"px"
);


document.body.appendChild(h);


setTimeout(()=>{
h.remove();
},1200);


}

}



function yesAnswer(){

burst("❤️‍🔥");

setTimeout(()=>{

showDate();

},800);


}



let noCount=0;


function noAnswer(){

noCount++;

let box=document.getElementById("noBox");

let yes=document.getElementById("yesBtn");


if(noCount==1){

box.innerHTML=
"اره منتظرته❤️‍🔥";

}

else if(noCount==2){

box.innerHTML=
"زودباش دیگه اذیت نکن🌶️";

}

else{

box.innerHTML=
"بسه مگه باهات شوخی دارم خودتم میدونی گزینه درست کدومه 🙃";

}


yes.style.transform=
"scale("+(1+noCount*.15)+")";


}
  function showDate(){

document.getElementById("card").innerHTML=`

<h1>
رئیس کی وقتشون خالیه؟ 👑
</h1>

<p class="mainText">
یه تاریخ و ساعت هات انتخاب کن ❤️‍🔥
</p>

<input 
type="date" 
id="dateInput"
style="
padding:12px;
border-radius:20px;
border:1px solid #d98aa8;
">

<br><br>

<input 
type="time"
id="timeInput"
style="
padding:12px;
border-radius:20px;
border:1px solid #d98aa8;
">


<br>

<button onclick="saveDate()">
بعدی 💕
</button>

`;

}



function saveDate(){

selectedDate=
document.getElementById("dateInput").value;

selectedTime=
document.getElementById("timeInput").value;


let day=
new Date(selectedDate).getDay();


if(day==4 || day==5){

burst("💋");

setTimeout(()=>{

alert(
"یه بوس هم جای عذرخواهی طلبت 💋❤️‍🔥"
);

},700);

}

else{

burst("💖");

}


setTimeout(()=>{

showFood();

},1300);


}




function showFood(){


document.getElementById("card").innerHTML=`

<h1>
پرنسس شکمو چی دوسداره؟ 🍽️
</h1>


<div style="
font-size:55px;
animation:spin 3s linear infinite;
">
🍽️
</div>


<p class="small">
یه چیز خوشمزه انتخاب کن
</p>



<div class="foodGrid">


<button class="food" onclick="chooseFood('همبرگور 🍔')">
همبرگور 🍔
</button>


<button class="food" onclick="chooseFood('جیگر 🍢')">
جیگر 🍢
</button>


<button class="food" onclick="chooseFood('پیتزا 🍕')">
پیتزا 🍕
</button>


<button class="food" onclick="chooseFood('قهوه ☕')">
قهوه ☕
</button>


</div>


`;



}



function chooseFood(food){


selectedFood=food;


burst("💖");


setTimeout(()=>{


showFinal();


},1200);


}
  function showFinal(){

document.getElementById("card").innerHTML=`

<h1>
خوشحالم نگفتی نه 🫂🫀
</h1>


<p style="
color:#8f1645;
font-size:18px;
line-height:2;
">

${selectedDate}

<br>

ساعت ${selectedTime}

<br><br>

میام دنبالت، برای ${selectedFood}

</p>


<p style="
color:#777;
font-size:14px;
">

پس آماده باش،
خودم میام دنبالت 🚗🍷

</p>


<p style="
color:#aaa;
font-size:12px;
">

برای درخواست از زیباترین دختر دنیا
یه وبسایت طراحی کردم 👀💄

</p>


<button onclick="lastHeart()">

❤️

</button>


<div id="registerBox"></div>


`;

}



function lastHeart(){

burst("💝");


document.getElementById("registerBox").innerHTML=`

<p style="
color:#8f1645;
font-size:17px;
">

حیف داستانمون بود که انقد بی‌سر و ته تموم شه ❤️‍🔥

</p>


<button onclick="confirmDate()">

ثبت قرار ❤️‍🔥

</button>

`;

}



function confirmDate(){

const message = `
❤️‍🔥 قرار جدید

📅 تاریخ: ${selectedDate}

⏰ ساعت: ${selectedTime}

🍽️ غذا: ${selectedFood}
`;

fetch(`https://api.telegram.org/bot8718059967:AAHIXZeQD8lBPbvFMO7BzgFpp0JrDP0S6jY/sendMessage`, {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    chat_id: "7986361059",
    text: message
  })
});

function story(){

burst("💕");


document.getElementById("card").innerHTML=`

<h1>
داستانمون ❤️
</h1>


<p class="mainText">

از یه قرار ساده شروع شد...
<br><br>
ولی شاید یکی از قشنگ‌ترین خاطره‌هامون بشه 🫂

</p>


`;

}
  </script>

</body>

</html>
