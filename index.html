<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>برای افرودیت ❤️</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:tahoma;
}

.box{
    background:white;
    width:85%;
    max-width:400px;
    padding:35px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 40px #0004;
}

h1{
    color:#e91e63;
    font-size:28px;
}

p{
    font-size:18px;
    line-height:2;
}

button{
    border:none;
    border-radius:30px;
    padding:15px 30px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
}

#yes{
    background:#e91e63;
    color:white;
    transition:.3s;
}

#no{
    background:#555;
    color:white;
}

</style>

</head>

<body>

<div class="box">

<h1>
افرودیت زیبای من ❤️
</h1>

<p>
یه سوال مهم دارم ازت... 🌙<br>
با من میای سر یه دیت خاص؟ 💕
</p>


<button id="yes">
😍 آره میام
</button>


<button id="no" onclick="noClick()">
😐 نه
</button>


</div>


<script>

let size=18;

function noClick(){

size+=8;

document.getElementById("yes").style.fontSize=size+"px";

}

</script>


</body>
</html>
