<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یک قرار خاص 💗</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

font-family:tahoma;

background:

linear-gradient(
rgba(90,0,45,.9),
rgba(40,0,25,.95)
);

overflow:hidden;

}



.box{

width:90%;

max-width:430px;

padding:35px;

text-align:center;

background:

rgba(255,255,255,.88);

border-radius:35px;

box-shadow:

0 15px 50px rgba(0,0,0,.4);

color:#5a0030;

animation:show 1s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



h1{

color:#98004b;

}



p{

font-size:19px;

line-height:2;

}



button{

border:none;

border-radius:40px;

padding:15px 30px;

margin:10px;

font-size:18px;

cursor:pointer;

transition:.4s;

}



#yes{

background:#a80055;

color:white;

}



#no{

background:#eee;

color:#800040;

}



button:hover{

transform:scale(1.1);

}



.floatHeart{

position:absolute;

font-size:25px;

animation:float 8s infinite linear;

}



@keyframes float{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-20vh);

}

}



.burst{

position:fixed;

font-size:30px;

z-index:10;

animation:explode 1.5s forwards;

}



@keyframes explode{


0%{

transform:translate(0,0) scale(.2);

opacity:1;

}


100%{

transform:translate(var(--x),var(--y)) scale(1.5);

opacity:0;

}


}



input{

width:90%;

padding:12px;

margin:8px;

border-radius:20px;

border:1px solid #ddd;

font-size:16px;

}


</style>

</head>


<body>


<div class="floatHeart" style="left:10%">💗</div>

<div class="floatHeart" style="left:45%;animation-delay:2s">💗</div>

<div class="floatHeart" style="left:75%;animation-delay:4s">💗</div>



<div class="box" id="box">


<h1>
افرودیت زیبای من 💗
</h1>


<p id="message">

با من میای سر یه دیت خاص؟ ✨

</p>


<button id="yes" onclick="yesClick()">

آره 😍

</button>


<button id="no" onclick="noClick()">

نه

</button>


</div>



<script>


let yesSize=18;

let noCount=0;


function noClick(){


noCount++;


let texts=[

"مطمئنی؟ یه بار دیگه فکر کن 💗",

"شاید این همون قراری باشه که بعداً خوشحالت کنه 😌",

"هنوز می‌تونی انتخاب قشنگ‌تری داشته باشی ✨",

"فکر کنم جواب واقعیت رو خودت می‌دونی 💗"

];


document.getElementById("message").innerHTML=

texts[Math.min(noCount-1,3)];


yesSize+=12;


document.getElementById("yes").style.fontSize=

yesSize+"px";


}




function heartExplosion(){


for(let i=0;i<50;i++){


let h=document.createElement("div");


h.className="burst";

h.innerHTML="💗";


h.style.left="50%";

h.style.top="50%";


h.style.setProperty(
"--x",
(Math.random()*600-300)+"px"
);


h.style.setProperty(
"--y",
(Math.random()*600-300)+"px"
);


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},1600);



}


}




function yesClick(){


heartExplosion();


setTimeout(()=>{


document.getElementById("box").innerHTML=


`

<h1>
انتخاب قشنگی کردی 💗
</h1>


<p>
حالا بریم قرارمون رو بسازیم ✨
</p>


<button onclick="showDate()">

انتخاب تاریخ 📅

</button>


`;


},1600);


}



</script>
  <script>


let dateSelected="";
let timeSelected="";
let foodSelected="";



function showDate(){


document.getElementById("box").innerHTML=

`

<h1>
کی وقت داری؟ 📅
</h1>


<p>
یه تاریخ و ساعت خوب انتخاب کن 💗
</p>


<input type="date" id="dateInput">


<input type="time" id="timeInput">


<p style="font-size:14px;color:#8b0038">

لطفاً پنج‌شنبه و جمعه رو انتخاب نکن ✨

</p>


<button onclick="saveDate()">

ادامه

</button>

`;

}




function saveDate(){


dateSelected=
document.getElementById("dateInput").value;


timeSelected=
document.getElementById("timeInput").value;



if(!dateSelected || !timeSelected){

alert("اول تاریخ و ساعت رو انتخاب کن 💗");

return;

}


foodPage();


}




function foodPage(){


document.getElementById("box").innerHTML=

`

<h1>
حالا انتخاب با توئه 💗
</h1>


<div class="plate">

🍽️

</div>


<p>
چی دوست داری مهمونت کنم؟ ✨
</p>



<div class="food" onclick="chooseFood('همبرگر معروف')">

🍔 همبرگر معروف

</div>


<div class="food" onclick="chooseFood('جیگر طرقبه')">

🥩 جیگر طرقبه

</div>


<div class="food" onclick="chooseFood('پیتزا آفتابگردون')">

🍕

پیتزا آفتابگردون

</div>


<div class="food" onclick="chooseFood('قهوه کافه')">

☕

قهوه (کافه)

</div>



`;

}




function chooseFood(food){


foodSelected=food;


document.querySelectorAll(".food").forEach(item=>{

item.style.transform="scale(.9)";

});


event.target.style.transform="scale(1.15)";


setTimeout(()=>{

finalPage();

},800);



}



</script>



<style>


.plate{


font-size:80px;

animation:rotatePlate 3s infinite linear;

}



@keyframes rotatePlate{


from{

transform:rotate(0deg);

}


to{

transform:rotate(360deg);

}


}



.food{


background:

rgba(150,0,70,.15);


padding:15px;


margin:12px;


border-radius:25px;


cursor:pointer;


transition:.4s;


animation:appear .7s;


}



.food:hover{


transform:scale(1.1);


background:

rgba(150,0,70,.3);


}



@keyframes appear{


from{

opacity:0;

transform:translateY(30px);

}


to{

opacity:1;

transform:translateY(0);

}


}


</style>
  <script>


function finalPage(){


document.getElementById("box").innerHTML=

`

<h1>
رئیس عصبانی 😌💗
</h1>


<p>


خوشحالم نگفتی نه! 💗


<br><br>


پس تاریخ ${dateSelected}

<br>

ساعت ${timeSelected}


<br><br>


میام دنبالت، برای ${foodSelected} 🥂


<br><br>


پس آماده باش، خودم میام دنبالت 🚗💨


<br><br>


برای درخواست از زیباترین دختر دنیا، یه سایت کوچولو طراحی کردم ❤️


</p>


<button onclick="lastExplosion()">

ادامه 💗

</button>


`;

}




function lastExplosion(){


for(let i=0;i<70;i++){


let h=document.createElement("div");


h.innerHTML="💗";


h.style.position="fixed";

h.style.left="50%";

h.style.top="50%";

h.style.fontSize=
(20+Math.random()*30)+"px";


h.style.transition="2s";


document.body.appendChild(h);



setTimeout(()=>{


h.style.transform=

`
translate(
${Math.random()*900-450}px,
${Math.random()*900-450}px
)
scale(1.5)
`;

h.style.opacity="0";


},50);



setTimeout(()=>{

h.remove();

},2200);



}



setTimeout(()=>{


document.getElementById("box").innerHTML=

`

<h1>
💗
</h1>


<p style="font-size:24px">

حیف داستانمون بود که انقدر بی‌سر و ته تموم شه!

</p>


`;


},2200);


}



</script>



</body>

</html>
