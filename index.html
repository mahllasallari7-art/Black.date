<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Black Date ❤️‍🔥</title>

<style>
*{
  box-sizing:border-box;
  font-family:Tahoma, Arial, sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#fff5f8,#f7c7d8,#fff);
  display:flex;
  justify-content:center;
  align-items:center;
}

.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.emoji{
  position:absolute;
  font-size:30px;
  animation:move 12s linear infinite;
  opacity:.7;
}

@keyframes move{
  0%{
    transform:translateY(110vh) rotate(0deg);
  }
  100%{
    transform:translateY(-20vh) rotate(360deg);
  }
}

.card{
  width:90%;
  max-width:420px;
  background:rgba(255,255,255,.85);
  padding:30px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 10px 40px rgba(139,22,72,.15);
  position:relative;
  z-index:2;
}

h1{
  color:#a83262;
}

p{
  color:#555;
  line-height:2;
}

button{
  border:none;
  padding:14px 30px;
  margin:10px;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  background:#b83b6f;
  color:white;
  transition:.3s;
}

button:hover{
  transform:scale(1.08);
}

.hidden{
  display:none;
}

input,select{
  width:90%;
  padding:12px;
  margin:8px;
  border-radius:15px;
  border:1px solid #ddd;
  font-size:16px;
}
</style>

</head>

<body>

<div class="bg" id="bg"></div>

<div class="card" id="page">

<h1>❤️‍🔥 قرارمون</h1>

<p>
چندتا سوال کوچولو دارم...
</p>

<button onclick="start()">شروع کنیم 💕</button>

</div>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbyC8iNDuTp_NWPh2P01qJodtmMuKZX785S5Ch8sKfWNAGR0qUuhgxtPsTHBvQ56hJHO/exec";


let selectedDate="";
let selectedTime="";
let selectedFood="";


const emojis=[
"❤️","💖","💕","❤️‍🔥","💋",
"🌶️","🍒","🍓","🍷",
"🥂","🥀","❣️","💝"
];


for(let i=0;i<40;i++){
 let e=document.createElement("div");
 e.className="emoji";
 e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
 e.style.left=Math.random()*100+"%";
 e.style.animationDelay=Math.random()*10+"s";
 e.style.fontSize=(20+Math.random()*25)+"px";
 document.getElementById("bg").appendChild(e);
}


function hearts(){

 for(let i=0;i<35;i++){
  let h=document.createElement("div");
  h.innerHTML="💖";
  h.style.position="fixed";
  h.style.left="50%";
  h.style.top="50%";
  h.style.fontSize="30px";
  h.style.zIndex="5";

  let x=(Math.random()-0.5)*400;
  let y=(Math.random()-0.5)*400;

  h.animate([
   {transform:"translate(0,0)",opacity:1},
   {transform:`translate(${x}px,${y}px)`,opacity:0}
  ],{
   duration:1000
  });

  document.body.appendChild(h);

  setTimeout(()=>h.remove(),1000);
 }

}


function start(){

 hearts();

 document.getElementById("page").innerHTML=`

<h1>اول انتخاب کن ❤️</h1>

<p>چه روزی ببینمت؟</p>

<input type="date" id="date">

<br>

<button onclick="saveDate()">بعدی 💕</button>

`;

}
<script>

function saveDate(){

 selectedDate=document.getElementById("date").value;

 hearts();

 document.getElementById("page").innerHTML=`

<h1>خب حالا ساعت ❤️‍🔥</h1>

<p>چه ساعتی بیام دنبالت؟</p>

<input type="time" id="time">

<br>

<button onclick="saveTime()">بعدی 💕</button>

`;

}


function saveTime(){

 selectedTime=document.getElementById("time").value;

 hearts();

 document.getElementById("page").innerHTML=`

<h1>انتخاب آخر 🍓</h1>

<p>چی بخوریم؟</p>

<select id="food">
<option>پیتزا 🍕</option>
<option>برگر 🍔</option>
<option>سوشی 🍣</option>
<option>دسر و قهوه 🍰☕</option>
<option>هرچی تو بخوای ❤️</option>
</select>

<br>

<button onclick="saveFood()">ثبت انتخاب 💖</button>

`;

}


function saveFood(){

 selectedFood=document.getElementById("food").value;

 hearts();

 document.getElementById("page").innerHTML=`

<h1>همه چی آماده‌ست ❤️‍🔥</h1>

<p>
${selectedDate}<br>
ساعت ${selectedTime}<br><br>
برای ${selectedFood}
</p>

<button onclick="confirmDate()">
ثبت قرار ❤️‍🔥
</button>

`;

}

function confirmDate(){

fetch(scriptURL,{
method:"POST",
body:JSON.stringify({

date:selectedDate,
time:selectedTime,
food:selectedFood

})
})
.then(()=>{

hearts();

document.getElementById("page").innerHTML=`

<h1 style="color:#a83262">
ثبت شد ❤️‍🔥
</h1>

<p>
قرارمون ثبت شد 💗<br>
منتظرت می‌مونم 🍷
</p>

<button onclick="story()">
داستانمون 🥀
</button>

`;

});

}



function story(){

hearts();

document.getElementById("page").innerHTML=`

<h1>
داستانمون ❤️
</h1>

<p>
از یه قرار ساده شروع شد...
<br><br>
ولی شاید یکی از قشنگ‌ترین خاطره‌هامون بشه ❤️‍🔥
</p>

`;

}
</script>

</body>
</html>
